[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "data-pipeline-immune-system"
version = "0.1.0"
description = "Autonomous data reliability platform — detect, diagnose, remediate, verify."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "agents*"]

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = [
    ".venv",
    "__pycache__",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long — black handles this
    "UP042", # str, Enum inheritance
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "safety_critical: tests that verify the core safety guarantees. These must always pass.",
    "integration: tests that require a real GCP environment.",
    "slow: tests that take more than 10 seconds.",
]
# Safety-critical tests get verbose output by default
addopts = "-v"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
# We skip B101 (assert statements) in tests — pytest relies on them
skips = []
