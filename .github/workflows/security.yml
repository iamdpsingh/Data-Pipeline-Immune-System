name: Security AST & Credential Scanner

on: [push, pull_request]

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Run Bandit Security Scan
        run: |
          pip install bandit
          bandit -r src/ agents/ spark/ -ll
